[package]
name = "harvest_router"
version = "0.1.0"
edition = "2021"
description = "HARVEST's per-step router (Steiner search, negotiated packing) as a Python extension"

[lib]
name = "harvest_router"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
